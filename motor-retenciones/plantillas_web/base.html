<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Retenciones{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0f1729; --tinta-2:#334155; --tenue:#64748b; --suave:#94a3b8;
  --linea:#e6eaf0; --linea-fuerte:#cbd5e1;
  --fondo:#f1f4f9; --panel:#fff;
  --acento:#2563eb; --acento-osc:#1d4ed8; --acento-suave:#eff5ff;
  --ok:#047857; --ok-suave:#ecfdf5;
  --alerta:#b45309; --alerta-suave:#fffbeb; --alerta-linea:#fde4b0;
  --rojo:#b91c1c; --rojo-suave:#fef2f2;
  --sombra:0 1px 2px rgba(15,23,41,.05), 0 1px 3px rgba(15,23,41,.06);
  --sombra-alta:0 4px 16px rgba(15,23,41,.08);
  --radio:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:Inter,"Segoe UI",system-ui,sans-serif;
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--acento); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- barra superior ---------- */
header{
  background:var(--panel); border-bottom:1px solid var(--linea);
  position:sticky; top:0; z-index:20;
}
.barra{
  max-width:1280px; margin:0 auto; padding:0 24px; height:58px;
  display:flex; align-items:center; gap:14px;
}
.marca{display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:-.01em}
.marca .pin{
  width:26px; height:26px; border-radius:8px; background:var(--acento);
  color:#fff; display:grid; place-items:center; font-size:13px; font-weight:700;
}
.marca small{display:block; font-weight:450; color:var(--tenue); font-size:12px; line-height:1.1}
.barra nav{margin-left:auto; display:flex; gap:4px; min-width:0; overflow-x:auto}
.barra nav a{white-space:nowrap}
@media (max-width:640px){.barra{padding:0 16px; gap:8px} .barra nav a{padding:6px 8px}}
.barra nav a{
  color:var(--tinta-2); padding:6px 12px; border-radius:8px; font-weight:500; font-size:13.5px;
}
.barra nav a:hover{background:var(--fondo); text-decoration:none}

main{max-width:1280px; margin:0 auto; padding:26px 24px 72px}

/* ---------- encabezado de página ---------- */
.titulo{display:flex; align-items:flex-end; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.titulo h1{font-size:21px; margin:0; font-weight:650; letter-spacing:-.02em}
.titulo p{margin:0; color:var(--tenue); font-size:13.5px}

/* ---------- tarjetas ---------- */
.panel{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--radio); box-shadow:var(--sombra);
  overflow:hidden;               /* que nada se escape de la tarjeta */
}
.panel table{table-layout:auto}
.acciones{width:1%; white-space:nowrap; text-align:right}
/* la tabla se comprime para entrar; el scroll es solo la red de seguridad */
.scroll-x{overflow-x:auto}
/* dentro del panel doble el espacio es la mitad: celdas mas compactas */
.compacta{font-size:13.5px}
.compacta thead th{padding:8px 10px; letter-spacing:.03em}
.compacta tbody td{padding:9px 10px}
.compacta tfoot td{padding:9px 10px}
.compacta .chip{padding:1px 7px}
.panel > .cab{
  padding:14px 18px; border-bottom:1px solid var(--linea);
  display:flex; align-items:center; gap:10px;
}
.panel > .cab h2{font-size:13.5px; margin:0; font-weight:620; letter-spacing:-.005em}
.panel > .cuerpo{padding:18px}
.panel > .cuerpo.ajustado{padding:0}

.doble{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:1040px){.doble{grid-template-columns:1fr}}
.apilado{display:grid; gap:20px}

/* ---------- tablas ---------- */
table{width:100%; border-collapse:collapse; font-size:14px}
thead th{
  text-align:left; padding:9px 18px; color:var(--tenue);
  font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.055em;
  background:#fafbfd; border-bottom:1px solid var(--linea); white-space:nowrap;
}
tbody td{padding:11px 18px; border-bottom:1px solid var(--linea)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}
.num{text-align:right; font-variant-numeric:tabular-nums}
tfoot td{
  padding:11px 18px; font-weight:650; border-top:1px solid var(--linea-fuerte);
  background:#fafbfd;
}
tfoot tr:first-child td{border-top:2px solid var(--tinta-2)}
.destacado{font-size:16px}

/* ---------- desglose del calculo ---------- */
.desglose{
  border:1px solid var(--linea); border-radius:10px; background:#fafbfd;
  padding:12px 14px; margin-top:12px; font-size:13px;
}
.desglose h3{
  margin:0 0 9px; font-size:12px; font-weight:620; color:var(--tenue);
  text-transform:uppercase; letter-spacing:.05em;
}
.desglose dl{display:grid; grid-template-columns:14px 1fr auto; gap:3px 8px; margin:0}
.desglose .signo{color:var(--suave); text-align:center}
.desglose dt{color:var(--tinta-2); min-width:0}
.desglose dd{margin:0; text-align:right; font-variant-numeric:tabular-nums}
.desglose .fuerte dt,.desglose .fuerte dd{font-weight:650; color:var(--tinta)}
.desglose .fuerte{border-top:1px solid var(--linea-fuerte); padding-top:4px; margin-top:2px}

.padron{
  border:1px solid var(--linea); border-radius:10px; background:#fafbfd;
  padding:12px 14px; margin-top:12px; font-size:13px;
}
.padron h3{
  margin:0 0 9px; font-size:12px; font-weight:620; color:var(--tenue);
  text-transform:uppercase; letter-spacing:.05em;
}
.padron .renglon{
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
  background:#fff; border:1px solid var(--linea); border-radius:7px;
  padding:8px 10px; overflow-x:auto; white-space:nowrap; color:var(--tinta-2);
}
.padron .campos-padron{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px 16px; margin-top:10px;
}
.padron .campos-padron span{display:block; color:var(--tenue); font-size:11.5px}
.padron .campos-padron strong{font-weight:600; font-size:13px}

/* ---------- lista de datos ---------- */
.dato{display:grid; grid-template-columns:132px minmax(0,1fr); gap:9px 16px; margin:0; font-size:13.8px}
.dato dt{color:var(--tenue)}
.dato dd{margin:0; word-break:break-word}
.dato dd.mono{font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ---------- formularios ---------- */
label{display:block; font-size:12px; color:var(--tenue); margin-bottom:5px;
      font-weight:550; letter-spacing:.01em}
input,select{
  width:100%; padding:8px 11px; border:1px solid var(--linea-fuerte);
  border-radius:9px; font:inherit; font-size:14px; background:#fff; color:var(--tinta);
  transition:border-color .12s, box-shadow .12s;
}
input:hover,select:hover{border-color:var(--suave)}
input:focus,select:focus{
  outline:none; border-color:var(--acento); box-shadow:0 0 0 3px var(--acento-suave);
}
.campos{display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:14px}
@media (max-width:640px){.campos{grid-template-columns:1fr}}

/* ---------- botones ---------- */
.boton{
  font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:9px;
  border:1px solid transparent; background:var(--acento); color:#fff;
  cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  transition:background .12s, box-shadow .12s;
}
.boton:hover{background:var(--acento-osc); text-decoration:none}
.boton.secundario{background:#fff; color:var(--tinta-2); border-color:var(--linea-fuerte)}
.boton.secundario:hover{background:var(--fondo)}
.boton:disabled{opacity:.45; cursor:not-allowed}

/* ---------- avisos ---------- */
.aviso{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--alerta-suave); border:1px solid var(--alerta-linea); color:var(--alerta);
  padding:11px 14px; border-radius:10px; font-size:13.5px; margin-bottom:12px;
}
.aviso.info{background:var(--acento-suave); border-color:#d3e3fd; color:var(--acento-osc)}
.aviso.malo{background:var(--rojo-suave); border-color:#fecaca; color:var(--rojo)}
.aviso .ico{flex:none; font-weight:700; line-height:1.4}
.aviso code{background:rgba(0,0,0,.05)}

/* ---------- varios ---------- */
.chip{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px;
  font-weight:600; background:var(--fondo); color:var(--tenue); border:1px solid var(--linea);
}
.chip.ok{background:var(--ok-suave); color:var(--ok); border-color:#a7f3d0}
.chip.acento{background:var(--acento-suave); color:var(--acento-osc); border-color:#d3e3fd}
.nota{color:var(--tenue); font-size:12.8px; margin:6px 0 0}
.vacio{padding:34px 18px; text-align:center; color:var(--tenue); font-size:13.5px}
code{background:#eef1f6; padding:1.5px 6px; border-radius:5px;
     font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px}
embed{width:100%; height:660px; border:none; border-radius:0 0 var(--radio) var(--radio);
      display:block; background:#525659}
hr{border:none; border-top:1px solid var(--linea); margin:16px 0}

/* zona de carga */
.soltar{
  border:1.5px dashed var(--linea-fuerte); border-radius:11px; padding:26px 18px;
  text-align:center; background:#fafbfd; transition:border-color .12s, background .12s;
}
.soltar.encima{border-color:var(--acento); background:var(--acento-suave)}
.soltar input[type=file]{display:none}
.soltar .grande{font-weight:600; font-size:15px; margin-bottom:3px}

/* panel de clientes */
.titulo-der{margin-left:auto; display:flex; gap:10px; align-items:center}
.titulo-der input{width:300px}
@media (max-width:640px){.titulo-der{margin-left:0; width:100%; flex-wrap:wrap} .titulo-der input{width:100%}}
.clientes{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr)); gap:16px}
@media (max-width:640px){main{padding:20px 16px 56px}}
.cli{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  box-shadow:var(--sombra); display:flex; flex-direction:column;
  transition:box-shadow .15s, border-color .15s, transform .15s;
}
.cli:hover{box-shadow:var(--sombra-alta); border-color:var(--linea-fuerte); transform:translateY(-1px)}
.cli[hidden]{display:none}
.cli-link{display:block; padding:18px 18px 14px; color:var(--tinta); flex:1}
.cli-link:hover{text-decoration:none}
.cli-cab{display:flex; gap:12px; align-items:center}
.avatar{
  flex:none; width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  background:var(--acento-suave); color:var(--acento-osc); font-weight:700; font-size:17px;
}
.cli-id{min-width:0}
.cli-id h2{margin:0; font-size:15.5px; font-weight:650; letter-spacing:-.01em}
.cli-id .rs{color:var(--tenue); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cli-id .sin{color:var(--suave); font-style:italic}
.cli-cifras{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px;
  border:1px solid var(--linea); border-radius:10px; background:#fafbfd;
}
.cli-cifras div{padding:9px 12px; border-left:1px solid var(--linea)}
.cli-cifras div:first-child{border-left:none}
.cli-cifras strong{display:block; font-size:17px; font-weight:650; font-variant-numeric:tabular-nums}
.cli-cifras span{display:block; font-size:11.5px; color:var(--tenue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cli-cifras div{min-width:0}
.cli-cifras .hay strong{color:var(--alerta)}
.cli-pie{
  display:flex; align-items:center; gap:8px; padding:10px 14px 10px 18px;
  border-top:1px solid var(--linea); min-height:48px;
}
.cli-pie .chips{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0}
.cli-pie .chip{white-space:nowrap}
.cli-acciones{display:flex; gap:4px; opacity:.55; transition:opacity .15s}
.cli:hover .cli-acciones{opacity:1}
.cli-acciones form{margin:0}
.mini{
  font:inherit; font-size:12.5px; font-weight:550; color:var(--tinta-2); background:none;
  border:1px solid transparent; border-radius:7px; padding:4px 9px; cursor:pointer;
}
.mini:hover{background:var(--fondo); border-color:var(--linea); text-decoration:none}
.cli.archivado{box-shadow:none; background:#fafbfd}
.cli.archivado .avatar{background:var(--fondo); color:var(--suave)}
.cli.archivado .cli-acciones{opacity:1}
.archivo{margin-top:28px}
.archivo summary{
  cursor:pointer; color:var(--tenue); font-weight:600; font-size:13.5px;
  padding:6px 0 14px; list-style:none;
}
.archivo summary::before{content:"▸ "; display:inline-block; transition:transform .15s}
.archivo[open] summary::before{transform:rotate(90deg)}
.modal{
  border:none; border-radius:14px; padding:22px; width:min(420px,calc(100vw - 32px));
  box-shadow:0 20px 50px rgba(15,23,41,.25);
}
.modal::backdrop{background:rgba(15,23,41,.35)}
.modal h2{margin:0 0 4px; font-size:17px}
.modal-botones{display:flex; justify-content:flex-end; gap:8px; margin-top:18px}
.banda-archivado{
  display:flex; align-items:center; gap:12px; background:var(--fondo);
  border:1px solid var(--linea-fuerte); border-radius:10px; padding:10px 14px;
  margin-bottom:16px; font-size:13.5px; color:var(--tinta-2);
}
.banda-archivado form{margin:0 0 0 auto}
.chip.alerta{background:var(--alerta-suave); color:var(--alerta); border-color:var(--alerta-linea)}
.casillas{display:flex; gap:18px; flex-wrap:wrap}
.casillas label{display:flex; align-items:center; gap:7px; font-size:14px; color:var(--tinta); margin:0}
.casillas input{width:auto}
</style>
</head>
<body>
<header>
  <div class="barra">
    <div class="marca">
      <span class="pin">R</span>
      <span>Retenciones<small>{{ cliente.nombre if cliente else 'Elegí un cliente' }}</small></span>
    </div>
    <nav>
      {% if cliente %}
      <a href="{{ url_for('bandeja') }}">Bandeja</a>
      <a href="{{ url_for('datos_cliente') }}">Datos del cliente</a>
      {% endif %}
      <a href="{{ url_for('padron') }}">Padrón AGIP</a>
      <a href="{{ url_for('panel') }}">Clientes</a>
    </nav>
  </div>
</header>
<main>
{% if cliente and cliente.archivado %}
<div class="banda-archivado">
  <span>Este cliente está archivado.</span>
  <form method="post" action="{{ url_for('desarchivar_cliente') }}">
    <input type="hidden" name="volver" value="{{ request.path }}">
    <button class="mini">Desarchivar</button>
  </form>
</div>
{% endif %}
{% block cuerpo %}{% endblock %}
</main>
</body>
</html>
